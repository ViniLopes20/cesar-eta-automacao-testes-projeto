[pytest]
testpaths = tests
addopts = -ra --strict-markers --html=reports/report.html --self-contained-html
markers =
    gerente: testes da área do gerente
    cliente: testes da área do cliente
    extrato: testes do extrato de transações
    navegacao: testes de navegação
    positivo: caminho positivo
    negativo: caminho negativo
    alta: prioridade alta
    media: prioridade média
    baixa: prioridade baixa
